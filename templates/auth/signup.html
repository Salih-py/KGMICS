{% extends 'base.html' %}
{% block title %}Sign Up — Student Registration{% endblock %}

{% block content %}
<div class="py-12 px-4 sm:px-6 lg:px-8 max-w-xl mx-auto">
    <div class="bg-white p-8 rounded-xl border border-slate-200 shadow-sm">
        <h2 class="text-2xl font-bold text-slate-800 text-center">Create Student Account</h2>
        <p class="text-xs text-slate-500 text-center mt-1">Join the KGIMCS Career Intelligence System</p>

        <form method="POST" action="{{ url_for('signup') }}" class="mt-6 space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase">Full Name *</label>
                <input type="text" name="full_name" required placeholder="e.g. John Doe"
                    class="mt-1 w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase">Email Address *</label>
                    <input type="email" name="email" required placeholder="student@college.edu"
                        class="mt-1 w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 uppercase">Gender *</label>
                        <select name="gender" required class="mt-1 w-full px-2 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white">
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 uppercase">Age *</label>
                        <input type="number" name="age" min="16" max="60" value="20" required
                            class="mt-1 w-full px-2 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                </div>
            </div>

            <!-- College Course Selection (14 Streams Grouped) -->
            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase">Degree Programme (College Stream) *</label>
                <select name="course_name" required class="mt-1 w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white">
                    <option value="" disabled selected>-- Select Your Degree Programme --</option>
                    {% for group_label, course_list in courses.items() %}
                        <optgroup label="{{ group_label }}">
                            {% for course in course_list %}
                                <option value="{{ course }}">{{ course }}</option>
                            {% endfor %}
                        </optgroup>
                    {% endfor %}
                </select>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase">Passout Year *</label>
                    <select name="passout_year" required class="mt-1 w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white">
                        {% for yr in range(2024, 2031) %}
                            <option value="{{ yr }}" {% if yr == 2026 %}selected{% endif %}>{{ yr }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase">Interested Career (Optional)</label>
                    <input type="text" name="interested_career" placeholder="e.g. Data Analyst, Chemist"
                        class="mt-1 w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase">Password *</label>
                    <input type="password" name="password" required placeholder="••••••••"
                        class="mt-1 w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase">Confirm Password *</label>
                    <input type="password" name="confirm_password" required placeholder="••••••••"
                        class="mt-1 w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
            </div>

            <button type="submit" class="w-full mt-2 py-2.5 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm rounded-lg shadow-sm transition">
                Register & Enter Portal
            </button>
        </form>

        <p class="text-center text-xs text-slate-500 mt-5">
            Already registered? <a href="{{ url_for('signin') }}" class="text-indigo-600 font-semibold hover:underline">Sign In here</a>
        </p>
    </div>
</div>
{% endblock %}
